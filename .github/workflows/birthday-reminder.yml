name: Birthday Reminder

on:
  schedule:
    # 09:00 Asia/Yerevan (UTC+4, no DST) = 05:00 UTC daily
    - cron: '0 5 * * *'
  workflow_dispatch: {}

jobs:
  check-birthdays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node src/checkBirthdays.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIRTHDAY_TZ: 'Asia/Yerevan'
