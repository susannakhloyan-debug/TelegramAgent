name: Birthday Reminder

on:
  schedule:
    # 06:00 UTC daily — adjust to suit your team, or set BIRTHDAY_TZ below
    # and keep the cron time itself as the earliest team member's morning.
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  check-birthdays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node src/checkBirthdays.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIRTHDAY_TZ: 'UTC'
