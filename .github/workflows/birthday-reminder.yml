name: Birthday Reminder

on:
  schedule:
    # ~08:30 Asia/Yerevan (UTC+4, no DST) = 04:23 UTC daily.
    # Off the top of the hour, because GitHub delays :00 schedules heavily.
    - cron: '23 4 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  check-birthdays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - run: node src/checkBirthdays.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BIRTHDAY_TZ: 'Asia/Yerevan'

      # GitHub auto-disables scheduled workflows in repos with no commits for
      # 60 days. Re-enabling the workflow through the API on every run resets
      # that timer, so the bot keeps running without anyone pushing commits.
      - name: Keep schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/birthday-reminder.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
